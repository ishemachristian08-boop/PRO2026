<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYABIHU CHRISTIAN ACADEMY</title>
    <meta name="description" content="Welcome to Nyabihu Christian Academy - Excellence in Education">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            border-radius: 50%;
            background: white;
            padding: 10px;
            object-fit: contain;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .tagline {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .coming-soon {
            font-size: 1.1rem;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            display: inline-block;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="nca logo.png" alt="NYABIHU CHRISTIAN ACADEMY Logo" class="logo">
        <h1>NYABIHU CHRISTIAN ACADEMY</h1>
        <p class="tagline">Excellence in Education | Character in Faith</p>
        <div class="coming-soon">
             Website Coming Soon!
        </div>
        <div class="footer">
            <p>Follow us for updates</p>
        </div>
    </div>
</body>
</html>
