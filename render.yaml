services:
  # Backend API Service
  - name: nca-backend
    type: web
    runtime: node
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        # NOTE: Replace with your MongoDB connection string
        # For MongoDB Atlas, use: mongodb+srv://username:password@cluster.mongodb.net/nca
        value: mongodb://localhost:27017/nca
      - key: JWT_SECRET
        # NOTE: Change this to a secure random string in production
        value: change-this-to-a-secure-random-string
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        # NOTE: Replace with your frontend URL after deployment
        value: https://nca-frontend.onrender.com

  # Frontend Static Site
  - name: nca-frontend
    type: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # NOTE: Replace with your backend URL after deployment
        value: https://nca-backend.onrender.com/api
      - key: NEXT_PUBLIC_APP_NAME
        value: "NYABIHU CHRISTIAN ACADEMY"
      - key: NEXT_PUBLIC_APP_URL
        # NOTE: Replace with your frontend URL
        value: https://nca-frontend.onrender.com

# NOTE: After deploying, you'll need to:
# 1. Set up a MongoDB database (MongoDB Atlas free tier recommended)
# 2. Update MONGODB_URI with your database connection string
# 3. Update FRONTEND_URL and NEXT_PUBLIC_API_URL with your actual URLs
# 4. Seed the database: npm run seed (in backend directory)
